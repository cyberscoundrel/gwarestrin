# LiteLLM gateway — one OpenAI-compatible entry point (chat + embeddings)
# for local backends and hosted providers.
#
# Deploy: copy to ~/gwarestrin/litellm-config/litellm-config.yaml on the
# deploy host (600 perms; dir is gitignored — same pattern as dab-config).
# Secrets come from the compose environment:
#   LITELLM_MASTER_KEY  — deploy convention: same value as LOCAL_INFERENCE_API_KEY,
#                         so existing clients pass LiteLLM's key check unchanged,
#                         and upstream llama.cpp accepts it too
#   OPENROUTER_API_KEY  — used by openrouter/* models
# Docs: docs/RUNBOOK.md "LiteLLM gateway"

model_list:
  # local llama.cpp (inference box). The full-gguf-path alias matches the
  # modelId agents already carry in providers.json — zero client churn.
  - model_name: /media/cyber/models0/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-Q8_K_XL.gguf
    litellm_params:
      model: openai/Qwen3.8-27B-UD-Q8_K_XL.gguf   # llama.cpp serves one model; field passes through
      api_base: http://100.96.0.9:8080/v1
      api_key: os.environ/LITELLM_MASTER_KEY

  # friendly alias for manual/API use, same backend
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/Qwen3.8-27B-UD-Q8_K_XL.gguf
      api_base: http://100.96.0.9:8080/v1
      api_key: os.environ/LITELLM_MASTER_KEY

  # hosted embeddings via OpenRouter (sentence-transformers/all-MiniLM-L6-v2, 384-dim)
  - model_name: embed-minilm
    litellm_params:
      model: openrouter/sentence-transformers/all-minilm-l6-v2
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true   # tolerate client params a backend doesn't support

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
