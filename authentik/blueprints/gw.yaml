# gwarestrin identity bootstrap — auto-applied by the authentik worker.
# Groups map to instance capability tiers; per-subdomain applications bind
# group membership so only the owner reaches their instance.
version: 1
entries:
  - id: group-gw-admin
    model: authentik_core.group
    identifiers:
      name: gw-admin
  - id: group-gw-user
    model: authentik_core.group
    identifiers:
      name: gw-user

  - id: user-admin
    model: authentik_core.user
    identifiers:
      username: admin
    attrs:
      name: admin
      email: admin@gw.home
      groups:
        - !KeyOf group-gw-admin
      password: "admin-pass-1"

  - id: user-alice
    model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice
      email: alice@gw.home
      groups:
        - !KeyOf group-gw-user
      password: "alice-pass-1"

  - id: user-bob
    model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob
      email: bob@gw.home
      groups:
        - !KeyOf group-gw-user
      password: "bob-pass-1"

  # ---- proxy providers (forward auth, embedded outpost) ----
  - id: provider-gw-admin
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: gw-admin-provider
    attrs:
      external_host: http://admin.gw.home
      internal_host: http://gwarestrin:3000
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      access_policy_expression: '"gw-admin" in request.user.group_attributes("name") or request.user.is_superuser'

  - id: provider-gw-alice
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: gw-alice-provider
    attrs:
      external_host: http://alice.gw.home
      internal_host: http://gw-alice:3000
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      access_policy_expression: '"gw-user" in request.user.group_attributes("name") or request.user.is_superuser'

  - id: provider-gw-bob
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: gw-bob-provider
    attrs:
      external_host: http://bob.gw.home
      internal_host: http://gw-bob:3000
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      access_policy_expression: '"gw-user" in request.user.group_attributes("name") or request.user.is_superuser'

  - id: application-gw-admin
    model: authentik_core.application
    identifiers:
      slug: gw-admin
    attrs:
      name: gw-admin
      provider: !KeyOf provider-gw-admin
      policy_engine_mode: any

  - id: application-gw-alice
    model: authentik_core.application
    identifiers:
      slug: gw-alice
    attrs:
      name: gw-alice
      provider: !KeyOf provider-gw-alice
      policy_engine_mode: any

  - id: application-gw-bob
    model: authentik_core.application
    identifiers:
      slug: gw-bob
    attrs:
      name: gw-bob
      provider: !KeyOf provider-gw-bob
      policy_engine_mode: any

  - id: outpost-embedded
    model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      type: proxy
      authentik_host: http://auth.gw.home:8880
      providers:
        - !KeyOf provider-gw-admin
        - !KeyOf provider-gw-alice
        - !KeyOf provider-gw-bob
