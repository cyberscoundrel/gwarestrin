# OpenShell gateway for gwarestrin: microVM driver, mTLS (clients present a
# certificate signed by the deployment CA; see openshell/scripts/pki.sh).
# Paths are inside the container; openshell/compose.yml mounts them.
[openshell]
version = 2

[openshell.gateway]
name = "openshell"
bind_address = "0.0.0.0:17670"
compute_driver = "vm"
log_level = "info"
# the in-container host supervisor's client bundle for its gRPC channel
guest_tls_ca = "/etc/openshell/pki/ca.crt"
guest_tls_cert = "/etc/openshell/pki/client/tls.crt"
guest_tls_key = "/etc/openshell/pki/client/tls.key"

[openshell.gateway.tls]
cert_path = "/etc/openshell/pki/server/tls.crt"
key_path = "/etc/openshell/pki/server/tls.key"
client_ca_path = "/etc/openshell/pki/ca.crt"

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/pki/jwt/signing.pem"
public_key_path = "/etc/openshell/pki/jwt/public.pem"
kid_path = "/etc/openshell/pki/jwt/kid"
gateway_id = "openshell"

[openshell.gateway.mtls_auth]
enabled = true

[openshell.drivers.vm]
grpc_endpoint = "https://127.0.0.1:17670"
state_dir = "/state/vm"
driver_dir = "/usr/local/libexec/openshell"
# bootstrap root disk; agent sandboxes use the image the server requests
default_image = "nvcr.io/nvidia/base/ubuntu:24.04"
vcpus = 2
# a ceiling, not a reservation: an idle agent VM measured ~260 MB
mem_mib = 1024
