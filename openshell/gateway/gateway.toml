# OpenShell gateway for gwarestrin: microVM driver. Callers present a client
# certificate signed by the deployment CA (transport gate, see
# openshell/scripts/pki.sh) AND an OIDC access token from authentik: the token's
# subject + groups decide what they may do (per-tenant workspaces). The
# certificate alone grants nothing (mTLS user auth is off).
# Paths are inside the container; openshell/compose.yml mounts them.
[openshell]
version = 2

[openshell.gateway]
name = "openshell"
bind_address = "0.0.0.0:17670"
compute_driver = "vm"
log_level = "info"
# the in-container host supervisor's client bundle for its gRPC channel
guest_tls_ca = "/etc/openshell/pki/ca.crt"
guest_tls_cert = "/etc/openshell/pki/client/tls.crt"
guest_tls_key = "/etc/openshell/pki/client/tls.key"

[openshell.gateway.tls]
cert_path = "/etc/openshell/pki/server/tls.crt"
key_path = "/etc/openshell/pki/server/tls.key"
client_ca_path = "/etc/openshell/pki/ca.crt"

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/pki/jwt/signing.pem"
public_key_path = "/etc/openshell/pki/jwt/public.pem"
kid_path = "/etc/openshell/pki/jwt/kid"
gateway_id = "openshell"

# off: with it on, a certificate holder is a local Platform Admin
[openshell.gateway.mtls_auth]
enabled = false

# authentik's internal HTTPS listener (deployment-CA cert, trusted through
# SSL_CERT_FILE in entrypoint.sh). Tokens come from client_credentials grants on
# the `openshell` OAuth2 provider; the provisioner creates the groups, the
# provider and one service account per tenant.
[openshell.gateway.oidc]
issuer = "https://authentik-server:9443/application/o/openshell/"
audience = "openshell-gateway"
roles_claim = "groups"
admin_role = "openshell-admin"
user_role = "openshell-user"

[openshell.drivers.vm]
grpc_endpoint = "https://127.0.0.1:17670"
state_dir = "/state/vm"
driver_dir = "/usr/local/libexec/openshell"
# bootstrap root disk; agent sandboxes use the image the server requests
default_image = "nvcr.io/nvidia/base/ubuntu:24.04"
vcpus = 2
# a ceiling, not a reservation: an idle agent VM measured ~260 MB
mem_mib = 1024
