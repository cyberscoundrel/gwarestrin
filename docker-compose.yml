services:
  gwarestrin:
    # build with host networking: on WARP hosts the docker bridge's inherited
    # upstream DNS may be unreachable (isp resolvers refusing non-isp source
    # IPs); the host stack resolves fine.
    build:
      context: .
      network: host

    ports:
      - "3000:3000"

    # don't inherit the host's isp resolvers (see above); public resolvers
    # are reachable through the docker-warp-bypass marked path. NOTE: this
    # bypasses docker's embedded resolver, so the dab sidecar is reached via
    # a static extra_hosts entry on the shared backend subnet instead.
    dns:
      - 1.1.1.1
      - 1.0.0.1

    # KVM for gondolin microvms. The container runs as the node user; the
    # host's kvm group gid is added so /dev/kvm stays accessible:
    #   KVM_GID=$(getent group kvm | cut -d: -f3)   # put this in .env
    user: node
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"

    environment:
      GWARESTRIN_MAX_AGENTS: ${GWARESTRIN_MAX_AGENTS:-4}
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json

    # all provider API keys referenced by providers.json apiKeyEnv live here
    env_file:
      - .env

    # lets containers reach services on the docker host (e.g. a local
    # inference box) via http://host.docker.internal:…
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # static backend addresses of the sidecars (see networks below)
      - "dab:172.31.99.10"
      - "neo4j-mcp:172.31.99.11"

    volumes:
      - gwarestrin-state:/var/lib/gwarestrin
      # guest image assets (~200MB), persistent across rebuilds
      - gondolin-cache:/home/node/.cache/gondolin
      # multi-provider topology (see providers.example.json); copy to
      # ./providers.json next to this file on the deploy host
      - ./providers.json:/etc/gwarestrin/providers.json:ro

    networks:
      - default   # outbound (WARP-bypass marked bridge)
      - backend   # sidecar link (container-local subnet)

    restart: unless-stopped

  # Microsoft SQL MCP Server (Data API builder) as an HTTP sidecar.
  # Own image/lifecycle — the base gwarestrin image carries no .NET.
  dab:
    build:
      context: ./dab
      network: host   # same WARP/DNS workaround as the main build
    user: "1000:1000"
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      ASPNETCORE_HTTP_PORTS: 5000   # bind 0.0.0.0 (default localhost is unreachable from other containers)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQL MCP configs; host-generated from dbcreds.json, contains DB
      # credentials (see dab-config.example/)
      - ./dab-config:/etc/dab:ro
    networks:
      backend:
        ipv4_address: 172.31.99.10
    restart: unless-stopped

  # Official neo4j MCP server (cypher) as an HTTP sidecar — same pattern as dab.
  # Reaches the neo4j container via the host's published bolt port.
  neo4j-mcp:
    image: mcp/neo4j-cypher:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: none           # neo4j runs with auth disabled (LAN-trust)
      NEO4J_DATABASE: neo4j
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: 8000
      NEO4J_MCP_SERVER_PATH: /mcp/
      # DNS-rebinding guard: allow how gwarestrin addresses us
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: neo4j-mcp,172.31.99.11,localhost,127.0.0.1
    networks:
      backend:
        ipv4_address: 172.31.99.11
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24

volumes:
  gwarestrin-state:
  gondolin-cache:
