services:
  gwarestrin:
    # build with host networking: on WARP hosts the docker bridge's inherited
    # upstream DNS may be unreachable (isp resolvers refusing non-isp source
    # IPs); the host stack resolves fine.
    image: gwarestrin:local
    build:
      context: .
      network: host

    ports:
      - "3000:3000"

    # don't inherit the host's isp resolvers (see above); public resolvers
    # are reachable through the docker-warp-bypass marked path. NOTE: this
    # bypasses docker's embedded resolver, so the dab sidecar is reached via
    # a static extra_hosts entry on the shared backend subnet instead.
    dns:
      - 1.1.1.1
      - 1.0.0.1

    # KVM for gondolin microvms. The container runs as the node user; the
    # host's kvm group gid is added so /dev/kvm stays accessible:
    #   KVM_GID=$(getent group kvm | cut -d: -f3)   # put this in .env
    user: node
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"

    environment:
      GWARESTRIN_MAX_AGENTS: ${GWARESTRIN_MAX_AGENTS:-4}
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json
      # labeled-sidecar discovery (empty = disabled)
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy:2375}
      # instance metadata (infra-authored; hot-reloaded; absent = open mode)
      GWARESTRIN_INSTANCE_METADATA: /etc/gwarestrin/instance.json

    # all provider API keys referenced by providers.json apiKeyEnv live here
    env_file:
      - .env

    # lets containers reach services on the docker host (e.g. a local
    # inference box) via http://host.docker.internal:…
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - gwarestrin-state:/var/lib/gwarestrin
      # guest image assets (~200MB), persistent across rebuilds
      - gondolin-cache:/home/node/.cache/gondolin
      # multi-provider topology (see providers.example.json); copy to
      # ./providers.json next to this file on the deploy host
      - ./providers.json:/etc/gwarestrin/providers.json:ro
      - ./instances/admin.json:/etc/gwarestrin/instance.json:ro

    labels:
      gwarestrin.tenant: "admin"

    networks:
      - default   # outbound (WARP-bypass marked bridge)
      - backend   # sidecar link (container-local subnet)

    restart: unless-stopped

  # Microsoft SQL MCP Server (Data API builder) as an HTTP sidecar.
  # Own image/lifecycle — the base gwarestrin image carries no .NET.
  dab:
    build:
      context: ./dab
      network: host   # same WARP/DNS workaround as the main build
    user: "1000:1000"
    # hot-reload watcher resolves dab-config.json relative to cwd
    working_dir: /etc/dab
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      ASPNETCORE_HTTP_PORTS: 5000   # bind 0.0.0.0 (default localhost is unreachable from other containers)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQL MCP configs; host-generated from dbcreds.json, contains DB
      # credentials (see dab-config.example/)
      - ./dab-config:/etc/dab:ro
    labels:
      gwarestrin.mcp.enable: "true"
      gwarestrin.mcp.name: "mssql"
      gwarestrin.mcp.port: "5000"
      gwarestrin.mcp.path: "/mcp"
      gwarestrin.mcp.description: "Microsoft SQL MCP Server (Data API builder)"
    networks:
      - backend
    restart: unless-stopped

  # LiteLLM gateway — one OpenAI-compatible endpoint (chat + embeddings) in
  # front of the local llama.cpp box and hosted providers (OpenRouter).
  # Config is host-generated from litellm-config.example/ (gitignored).
  # Master key convention: same value as LOCAL_INFERENCE_API_KEY, so existing
  # clients pass the key check unchanged and llama.cpp accepts upstream calls.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config/litellm-config.yaml", "--port", "4000"]
    ports:
      # host 4000 is taken by an existing host service; gateway publishes on 4100
      - "4100:4000"
    # public resolvers past WARP's DNS interception (openrouter.ai), same as gwarestrin
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      LITELLM_MASTER_KEY: ${LOCAL_INFERENCE_API_KEY:?set LOCAL_INFERENCE_API_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    volumes:
      - ./litellm-config:/app/config:ro
    healthcheck:
      # image has no bash; python is guaranteed
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      gwarestrin.net: "true"
    networks:
      - backend
    restart: unless-stopped

  # graph-rag MCP sidecar — facet-indexed vector retrieval over neo4j
  # (search_graph / upsert_entities / embed_backfill). Embeds via the litellm
  # gateway; facet texts are model-authored at upsert time; a periodic sweep
  # backfills the deterministic identity facet for raw-cypher writes.
  graph-rag:
    build:
      context: ./graph-rag
      network: host   # npm install needs the WARP-bypassed path (same as dab)
    environment:
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_DB: gwarestrin
      ARCADEDB_USER: root
      ARCADEDB_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:?set ARCADEDB_ROOT_PASSWORD in .env}
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LOCAL_INFERENCE_API_KEY:?set LOCAL_INFERENCE_API_KEY in .env}
      EMBED_MODEL: embed-minilm
      EMBED_DIM: "384"
      SWEEP_INTERVAL_MS: "600000"
      # identity capability map (infra-authored; hot-reloaded)
      TOKEN_MAP_PATH: /app/token-map.json
    volumes:
      - ./graph-rag-config/token-map.json:/app/token-map.json:ro
    labels:
      gwarestrin.mcp.enable: "true"
      gwarestrin.mcp.port: "8000"
      gwarestrin.mcp.path: "/mcp"
      gwarestrin.mcp.description: "facet-indexed vector retrieval + graph MCP"
    networks:
      - backend
    restart: unless-stopped

  # ArcadeDB — multi-model graph store (Apache-2.0) replacing neo4j. Serves
  # the knowledge graph over HTTP JSON + built-in MCP server (/api/v1/mcp,
  # rag profile). Backend-network name resolves via docker's embedded DNS —
  # no static IP or extra_hosts needed.
  arcadedb:
    image: arcadedata/arcadedb:latest
    mem_limit: 2g
    # Studio + HTTP API published to the tailnet (auth: root + the password
    # in the secret file below)
    ports:
      - "2480:2480"
    environment:
      # root password via secret file (not visible in process args); the
      # defaultDatabases setting creates an empty `gwarestrin` db at boot.
      # The image pins a 2G heap by default — size it explicitly so it fits
      # inside the container limit.
      ARCADEDB_OPTS_MEMORY: "-Xms512m -Xmx1g"
      ARCADEDB_SETTINGS: "-Darcadedb.server.rootPasswordPath=/run/secrets/adb-root-pw -Darcadedb.server.defaultDatabases=gwarestrin[root]"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
      # single-file mounts only — the config dir itself must stay writable
      # (setting the root password persists server-users.jsonl into it)
      - ./arcadedb-config/mcp-config.json:/home/arcadedb/config/mcp-config.json:ro
      - ./arcadedb-config/root-pw:/run/secrets/adb-root-pw:ro
    networks:
      - backend
    restart: unless-stopped

  # read-only Docker API proxy — gwarestrin's sidecar discovery reads
  # labeled containers through it (least privilege; no socket mount)
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped

  # ---- per-user instances (identity-tier test identities) ----
  # alice: graph read + writes queued for review
  gw-alice:
    image: gwarestrin:local
    environment:
      GWARESTRIN_MAX_AGENTS: "2"
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json
      GWARESTRIN_INSTANCE_METADATA: /etc/gwarestrin/instance.json
    volumes:
      - gwarestrin-state-alice:/var/lib/gwarestrin
      - gondolin-cache-alice:/home/node/.cache/gondolin
      - ./providers.json:/etc/gwarestrin/providers.json:ro
      - ./instances/alice.json:/etc/gwarestrin/instance.json:ro
    labels:
      gwarestrin.tenant: "alice"
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - backend
    restart: unless-stopped

  # bob: read-only graph (writes denied)
  gw-bob:
    image: gwarestrin:local
    environment:
      GWARESTRIN_MAX_AGENTS: "2"
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json
      GWARESTRIN_INSTANCE_METADATA: /etc/gwarestrin/instance.json
    volumes:
      - gwarestrin-state-bob:/var/lib/gwarestrin
      - gondolin-cache-bob:/home/node/.cache/gondolin
      - ./providers.json:/etc/gwarestrin/providers.json:ro
      - ./instances/bob.json:/etc/gwarestrin/instance.json:ro
    labels:
      gwarestrin.tenant: "bob"
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - backend
    restart: unless-stopped

  # ---- identity tier (first implementation; swappable) ----
  authentik-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  authentik-redis:
    image: redis:alpine
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP__EMAIL: admin@gw.home
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    networks:
      - default
      - backend
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
    user: root
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    networks:
      - default
      - backend
    restart: unless-stopped

  # ---- edge reverse proxy (tailnet-only, plain HTTP) ----
  # instance routers come from docker labels (providers.docker); the file
  # provider holds auth.gw.home + the outpost router only.
  traefik:
    image: traefik:v3.5
    command:
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
    ports:
      # standard :80 edge (pihole web moved to :8080)
      - "80:80"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - backend
    restart: unless-stopped

  # ---- write-scoped docker API for the tenant provisioner ----
  # separate from the read-only proxy so the server's discovery client
  # never sees write access.
  docker-proxy-write:
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped

  # ---- tenant provisioner: authentik roles -> per-user instances ----
  # Creates/locks/stops per-user gwarestrin containers, writes their
  # authentik objects, graph tokens, instance metadata and traefik routes.
  provisioner:
    build: ./provisioner
    environment:
      AUTHENTIK_URL: http://authentik-server:9000
      AUTHENTIK_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      DOCKER_API: http://docker-proxy-write:2375
      DOMAIN: gw.home
      TIER_GROUPS: gw-admin:admin,gw-user:user
      SEED_TENANTS: admin,alice,bob
      KVM_GID: ${KVM_GID:-993}
      COMPOSE_PROJECT: gwarestrin
      POLL_SECONDS: "30"
    volumes:
      - ./instances:/data/instances
      - ./graph-rag-config:/data/graph-rag-config
      - ./traefik/dynamic:/data/traefik
      - ./providers.json:/data/providers.json:ro
      - ./.env:/data/.env:ro
    depends_on:
      - authentik-server
      - docker-proxy-write
    networks:
      - backend
    restart: unless-stopped

  # ---- headless browser for ux tests (on demand: --profile ux) ----
  ux-test:
    build:
      context: ./ux-tests
      network: host
    profiles: ["ux"]
    command: ["sleep", "infinity"]
    volumes:
      - ./ux-tests:/tests
    extra_hosts:
      - "admin.gw.home:host-gateway"
      - "alice.gw.home:host-gateway"
      - "bob.gw.home:host-gateway"
      - "auth.gw.home:host-gateway"
    networks:
      - default
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24

volumes:
  gwarestrin-state:
  gondolin-cache:
  arcadedb-data:
  gwarestrin-state-alice:
  gondolin-cache-alice:
  gwarestrin-state-bob:
  gondolin-cache-bob:
  authentik-pg:
