services:
  gwarestrin:
    # build with host networking: on WARP hosts the docker bridge's inherited
    # upstream DNS may be unreachable (isp resolvers refusing non-isp source
    # IPs); the host stack resolves fine.
    build:
      context: .
      network: host

    ports:
      - "3000:3000"

    # don't inherit the host's isp resolvers (see above); public resolvers
    # are reachable through the docker-warp-bypass marked path. NOTE: this
    # bypasses docker's embedded resolver, so the dab sidecar is reached via
    # a static extra_hosts entry on the shared backend subnet instead.
    dns:
      - 1.1.1.1
      - 1.0.0.1

    # KVM for gondolin microvms. The container runs as the node user; the
    # host's kvm group gid is added so /dev/kvm stays accessible:
    #   KVM_GID=$(getent group kvm | cut -d: -f3)   # put this in .env
    user: node
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"

    environment:
      GWARESTRIN_MAX_AGENTS: ${GWARESTRIN_MAX_AGENTS:-4}
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json

    # all provider API keys referenced by providers.json apiKeyEnv live here
    env_file:
      - .env

    # lets containers reach services on the docker host (e.g. a local
    # inference box) via http://host.docker.internal:…
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # static backend addresses of the sidecars (see networks below)
      - "dab:172.31.99.10"
      - "neo4j-mcp:172.31.99.11"
      - "litellm:172.31.99.12"
      - "graph-rag:172.31.99.13"

    volumes:
      - gwarestrin-state:/var/lib/gwarestrin
      # guest image assets (~200MB), persistent across rebuilds
      - gondolin-cache:/home/node/.cache/gondolin
      # multi-provider topology (see providers.example.json); copy to
      # ./providers.json next to this file on the deploy host
      - ./providers.json:/etc/gwarestrin/providers.json:ro

    networks:
      - default   # outbound (WARP-bypass marked bridge)
      - backend   # sidecar link (container-local subnet)

    restart: unless-stopped

  # Microsoft SQL MCP Server (Data API builder) as an HTTP sidecar.
  # Own image/lifecycle — the base gwarestrin image carries no .NET.
  dab:
    build:
      context: ./dab
      network: host   # same WARP/DNS workaround as the main build
    user: "1000:1000"
    # hot-reload watcher resolves dab-config.json relative to cwd
    working_dir: /etc/dab
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      ASPNETCORE_HTTP_PORTS: 5000   # bind 0.0.0.0 (default localhost is unreachable from other containers)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQL MCP configs; host-generated from dbcreds.json, contains DB
      # credentials (see dab-config.example/)
      - ./dab-config:/etc/dab:ro
    networks:
      backend:
        ipv4_address: 172.31.99.10
    restart: unless-stopped

  # Official neo4j MCP server (cypher) as an HTTP sidecar — same pattern as dab.
  # Reaches the neo4j container via the host's published bolt port.
  neo4j-mcp:
    image: mcp/neo4j-cypher:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEO4J_URI: bolt://neo4j:7687   # shared backend network (docker DNS); host.docker.internal hits docker-proxy DNAT + cross-bridge isolation
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: none           # neo4j runs with auth disabled (LAN-trust)
      NEO4J_DATABASE: neo4j
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: 8000
      NEO4J_MCP_SERVER_PATH: /mcp/
      # DNS-rebinding guard: allow how gwarestrin addresses us
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: neo4j-mcp,172.31.99.11,localhost,127.0.0.1
    networks:
      backend:
        ipv4_address: 172.31.99.11
    restart: unless-stopped

  # LiteLLM gateway — one OpenAI-compatible endpoint (chat + embeddings) in
  # front of the local llama.cpp box and hosted providers (OpenRouter).
  # Config is host-generated from litellm-config.example/ (gitignored).
  # Master key convention: same value as LOCAL_INFERENCE_API_KEY, so existing
  # clients pass the key check unchanged and llama.cpp accepts upstream calls.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config/litellm-config.yaml", "--port", "4000"]
    ports:
      # host 4000 is taken by an existing host service; gateway publishes on 4100
      - "4100:4000"
    # public resolvers past WARP's DNS interception (openrouter.ai), same as gwarestrin
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      LITELLM_MASTER_KEY: ${LOCAL_INFERENCE_API_KEY:?set LOCAL_INFERENCE_API_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    volumes:
      - ./litellm-config:/app/config:ro
    healthcheck:
      # image has no bash; python is guaranteed
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      backend:
        ipv4_address: 172.31.99.12
    restart: unless-stopped

  # graph-rag MCP sidecar — facet-indexed vector retrieval over neo4j
  # (search_graph / upsert_entities / embed_backfill). Embeds via the litellm
  # gateway; facet texts are model-authored at upsert time; a periodic sweep
  # backfills the deterministic identity facet for raw-cypher writes.
  graph-rag:
    build:
      context: ./graph-rag
      network: host   # npm install needs the WARP-bypassed path (same as dab)
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LOCAL_INFERENCE_API_KEY:?set LOCAL_INFERENCE_API_KEY in .env}
      EMBED_MODEL: embed-minilm
      EMBED_DIM: "384"
      SWEEP_INTERVAL_MS: "600000"
    networks:
      backend:
        ipv4_address: 172.31.99.13
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24

volumes:
  gwarestrin-state:
  gondolin-cache:
