services:
  gwarestrin:
    # build with host networking: on WARP hosts the docker bridge's inherited
    # upstream DNS may be unreachable (isp resolvers refusing non-isp source
    # IPs); the host stack resolves fine.
    build:
      context: .
      network: host

    ports:
      - "3000:3000"

    # don't inherit the host's isp resolvers (see above); public resolvers
    # are reachable through the docker-warp-bypass marked path
    dns:
      - 1.1.1.1
      - 1.0.0.1

    # KVM for gondolin microvms. The container runs as the node user; the
    # host's kvm group gid is added so /dev/kvm stays accessible:
    #   KVM_GID=$(getent group kvm | cut -d: -f3)   # put this in .env
    user: node
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"

    environment:
      GWARESTRIN_MAX_AGENTS: ${GWARESTRIN_MAX_AGENTS:-4}
      GWARESTRIN_STATE: /var/lib/gwarestrin
      GWARESTRIN_PROVIDERS_FILE: /etc/gwarestrin/providers.json

    # all provider API keys referenced by providers.json apiKeyEnv live here
    env_file:
      - .env

    # lets containers reach services on the docker host (e.g. a local
    # inference box) via http://host.docker.internal:…
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - gwarestrin-state:/var/lib/gwarestrin
      # guest image assets (~200MB), persistent across rebuilds
      - gondolin-cache:/home/node/.cache/gondolin
      # multi-provider topology (see providers.example.json); copy to
      # ./providers.json next to this file on the deploy host
      - ./providers.json:/etc/gwarestrin/providers.json:ro
      # SQL MCP Server (DAB) configs; host-generated from dbcreds.json,
      # contains DB credentials (see dab-config.example/)
      - ./dab-config:/etc/gwarestrin/dab:ro

    restart: unless-stopped

volumes:
  gwarestrin-state:
  gondolin-cache:
