# gwarestrin edge — tailnet-only, plain HTTP (tailscale encrypts transport)
http:
  routers:
    # authentik outpost endpoints must win over app routers
    gw-outpost:
      rule: "PathPrefix(`/outpost.goauthentik.io`)"
      service: authentik
      priority: 100
    authentik:
      rule: "Host(`auth.gw.home`)"
      service: authentik
    gw-admin:
      rule: "Host(`admin.gw.home`)"
      service: gw-admin
      middlewares:
        - gw-forward-auth
    gw-alice:
      rule: "Host(`alice.gw.home`)"
      service: gw-alice
      middlewares:
        - gw-forward-auth
    gw-bob:
      rule: "Host(`bob.gw.home`)"
      service: gw-bob
      middlewares:
        - gw-forward-auth

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    gw-admin:
      loadBalancer:
        servers:
          - url: "http://gwarestrin:3000"
    gw-alice:
      loadBalancer:
        servers:
          - url: "http://gw-alice:3000"
    gw-bob:
      loadBalancer:
        servers:
          - url: "http://gw-bob:3000"

  middlewares:
    gw-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/simple"
        trustForwardHeader: true
