# gwarestrin edge — tailnet-only, plain HTTP (tailscale encrypts transport)
# Instance routers are docker-provider label routes (on the gw-* containers);
# this file holds only the identity-plane routes.
http:
  routers:
    # authentik outpost endpoints must win over app routers
    gw-outpost:
      rule: "PathPrefix(`/outpost.goauthentik.io`)"
      service: authentik
      priority: 100
    authentik:
      rule: "Host(`auth.gw.home`)"
      service: authentik

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"

  middlewares:
    gw-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
